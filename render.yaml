services:
  # ============================================================
  # PHẦN 1: HẠ TẦNG CƠ SỞ DỮ LIỆU (INFRASTRUCTURE - PRIVATE SERVICES)
  # ============================================================

  # 1. MySQL (cho identity-service)
  - type: pserv
    name: mysql-db
    env: docker
    repo: https://github.com/qthai1812/demo_microservice # Repo của bạn
    dockerfilePath: Dockerfile.dummy # Sẽ chạy image từ Docker Hub thay vì build repo
    image: mysql:8.0.40-debian
    plan: free
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: root
      - key: MYSQL_DATABASE
        value: bookteria_identity

  # 2. MongoDB (cho post, file, chat, notification)
  - type: pserv
    name: mongodb-db
    env: docker
    image: mongo:8.0.1-noble
    plan: free
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 1
    envVars:
      - key: MONGO_INITDB_ROOT_USERNAME
        value: root
      - key: MONGO_INITDB_ROOT_PASSWORD
        value: root

  # 3. Neo4j (cho profile-service)
  - type: pserv
    name: neo4j-db
    env: docker
    image: neo4j:5.24.2
    plan: free
    disk:
      name: neo4j-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NEO4J_AUTH
        value: neo4j/12345678

  # 4. Kafka (cho Event broker)
  - type: pserv
    name: kafka-broker
    env: docker
    image: apache/kafka:3.7.0
    plan: free
    envVars:
      - key: KAFKA_NODE_ID
        value: 1
      - key: KAFKA_PROCESS_ROLES
        value: broker,controller
      - key: KAFKA_LISTENERS
        value: PLAINTEXT://:9092,CONTROLLER://:9093
      - key: KAFKA_ADVERTISED_LISTENERS
        value: PLAINTEXT://kafka-broker:9092
      - key: KAFKA_CONTROLLER_LISTENER_NAMES
        value: CONTROLLER
      - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - key: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: 1@kafka-broker:9093
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: 1

  # ============================================================
  # PHẦN 2: CÁC DỊCH VỤ BACKEND (BACKEND SERVICES - PRIVATE SERVICES)
  # ============================================================

  # 5. Identity Service
  - type: pserv
    name: identity-service
    env: docker
    dockerContext: ./identity-service
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-db:3306/bookteria_identity?useSSL=false
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: root
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: kafka-broker:9092

  # 6. Profile Service
  - type: pserv
    name: profile-service
    env: docker
    dockerContext: ./profile-service
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_NEO4J_URI
        value: bolt://neo4j-db:7687
      - key: SPRING_NEO4J_AUTHENTICATION_USERNAME
        value: neo4j
      - key: SPRING_NEO4J_AUTHENTICATION_PASSWORD
        value: 12345678

  # 7. Post Service
  - type: pserv
    name: post-service
    env: docker
    dockerContext: ./post-service
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        value: mongodb://root:root@mongodb-db:27017/post-service?authSource=admin

  # 8. File Service
  - type: pserv
    name: file-service
    env: docker
    dockerContext: ./file-service
    dockerfilePath: Dockerfile
    plan: free
    disk:
      name: file-storage
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        value: mongodb://root:root@mongodb-db:27017/file-service?authSource=admin

  # 9. Chat Service
  - type: pserv
    name: chat-service
    env: docker
    dockerContext: ./chat-service
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        value: mongodb://root:root@mongodb-db:27017/chat-service?authSource=admin

  # 10. Notification Service
  - type: pserv
    name: notification-service
    env: docker
    dockerContext: ./notification-service
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        value: mongodb://root:root@mongodb-db:27017/notification-service?authSource=admin
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: kafka-broker:9092

  # ============================================================
  # PHẦN 3: CỔNG GIAO TIẾP TRUNG TÂM (API GATEWAY - PUBLIC WEB SERVICE)
  # ============================================================

  # 11. API Gateway
  - type: web
    name: api-gateway
    env: docker
    dockerContext: ./api-gateway
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: IDENTITY_SERVICE_URL
        value: http://identity-service:8080
      - key: PROFILE_SERVICE_URL
        value: http://profile-service:8085
      - key: POST_SERVICE_URL
        value: http://post-service:8084
      - key: FILE_SERVICE_URL
        value: http://file-service:8081
      - key: CHAT_SERVICE_URL
        value: http://chat-service:8082
      - key: NOTIFICATION_SERVICE_URL
        value: http://notification-service:8083
