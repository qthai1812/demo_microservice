server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8080
          predicates:
            - Path=/identity/**
          filters:
         

        - id: profile-service
          uri: http://localhost:8081
          predicates:
            - Path=/profile/**
          filters:


        - id: notification-service
          uri: http://localhost:8082
          predicates:
            - Path=/notification/**
          filters:

        - id: post-service
          uri: http://localhost:8083
          predicates:
            - Path=/post/**
          filters:

        - id: file-service
          uri: http://localhost:8084
          predicates:
            - Path=/file/**
          filters:

        - id: chat-service
          uri: http://localhost:8085
          predicates:
            - Path=/chat/**
          filters:
