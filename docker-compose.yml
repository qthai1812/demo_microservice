version: '3.8'
name: bookteria

services:
  # ==========================================
  # PHẦN 1: HẠ TẦNG (INFRASTRUCTURE)
  # ==========================================

  kafka:
    image: 'apache/kafka:3.7.0'
    container_name: kafka
    hostname: kafka
    restart: always
    ports:
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:8.0.1-noble
    container_name: mongodb
    hostname: mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.0.40-debian
    container_name: mysql
    hostname: mysql
    restart: always
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookteria_identity
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5.24.2
    container_name: neo4j
    hostname: neo4j
    restart: always
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      - NEO4J_AUTH=neo4j/12345678
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # PHẦN 2: BACKEND SERVICES
  # ==========================================

  identity-service:
    build:
      context: ./identity-service
    container_name: identity-service
    hostname: identity-service
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bookteria_identity
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PROFILE_SERVICE_URL=http://profile-service:8085/profile
      - JWT_SIGNER_KEY=1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij
    restart: always

  gateway-service:
    build:
      context: ./api-gateway
    container_name: gateway-service
    hostname: gateway-service
    ports:
      - '8888:8888'
    environment:
      - IDENTITY_SERVICE_URL=http://identity-service:8080
      - PROFILE_SERVICE_URL=http://profile-service:8085/profile
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
      - POST_SERVICE_URL=http://post-service:8084
      - FILE_SERVICE_URL=http://file-service:8081
      - CHAT_SERVICE_URL=http://chat-service:8082
    depends_on:
      - identity-service
    restart: always

  file-service:
    build:
      context: ./file-service
    container_name: file-service
    hostname: file-service
    ports:
      - '8081:8081'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongodb:27017/file-service?authSource=admin
      - FILE_STORAGE_DIR=/app/uploads
      - FILE_DOWNLOAD_PREFIX=http://localhost:8888/file/media/download/
      - JWT_SIGNER_KEY=1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij
    volumes:
      - file_uploads:/app/uploads
    restart: always

  chat-service:
    build:
      context: ./chat-service
    container_name: chat-service
    hostname: chat-service
    ports:
      - '8082:8082'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongodb:27017/chat-service?authSource=admin
      - PROFILE_SERVICE_URL=http://profile-service:8085/profile
      - JWT_SIGNER_KEY=1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij
    restart: always

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    hostname: notification-service
    ports:
      - '8083:8083'
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongodb:27017/notification-service?authSource=admin
      - JWT_SIGNER_KEY=1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij
    restart: always

  post-service:
    build:
      context: ./post-service
    container_name: post-service
    hostname: post-service
    ports:
      - '8084:8084'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongodb:27017/post-service?authSource=admin
      - PROFILE_SERVICE_URL=http://profile-service:8085/profile
      - JWT_SIGNER_KEY=1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij
    restart: always

  profile-service:
    build:
      context: ./profile-service
    container_name: profile-service
    hostname: profile-service
    ports:
      - '8085:8085'
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=12345678
      - FILE_SERVICE_URL=http://file-service:8081
      - JWT_SIGNER_KEY=1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij
    restart: always

# ==========================================
# VOLUMES (Lưu trữ dữ liệu bền vững)
# ==========================================
volumes:
  mysql_data:
  mongodb_data:
  neo4j_data:
  file_uploads:
